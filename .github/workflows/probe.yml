name: probe

# Jednorazowe rozpoznanie portali (ID kategorii, pola kraju/sprzedawcy). Uruchamiane ręcznie
# lub po zmianie skryptu; wynik w logu i w Artifacts.
on:
  push:
    paths:
      - "scripts/probe_categories.py"
      - ".github/workflows/probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx
      - run: python scripts/probe_categories.py probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe.txt
