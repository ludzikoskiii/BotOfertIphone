name: live-sources

# Codzienny test „na żywo”: czy każdy portal nadal zwraca oferty.
# Czerwony przebieg = któryś adapter przestał działać (raport w logu i w Artifacts).
on:
  push:
    paths:
      - "phonebot/sources/**"
      - "phonebot/net/**"
      - "phonebot/diagnose.py"
      - "tests/test_live_sources.py"
      - ".github/workflows/live-sources.yml"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx tenacity selectolax pytest
      - name: Diagnostyka źródeł (raport)
        run: python -m phonebot.diagnose --out diagnostyka.txt --json diagnostyka.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostyka-zrodel
          path: diagnostyka.*
      - name: Testy kanarkowe (czy portale zwracają oferty)
        run: python -m pytest -m live -v tests/test_live_sources.py
