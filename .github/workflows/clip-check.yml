name: clip-check

# Analiza zdjęć w kodzie programu na prawdziwym modelu CLIP: pobranie z kontrolą SHA-256, skuteczność
# na zdjęciach z Vinted i czas analizy jednego zdjęcia na procesorze (Linux i Windows). Wynik w logu.
on:
  push:
    paths:
      - "phonebot/ml/photo_model.py"
      - "scripts/clip_check_app.py"
      - ".github/workflows/clip-check.yml"
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/clip_check_app.py
        env:
          PYTHONPATH: .
          PYTHONIOENCODING: utf-8
