name: ollama-check

# Analiza opisów w kodzie programu na prawdziwej Ollamie z modelem qwen3:8b (CPU serwera CI — wolniej
# niż na karcie graficznej). Uruchamiane po zmianie modułu opisów albo ręcznie. Wynik w logu.
on:
  push:
    paths:
      - "phonebot/ml/desc_model.py"
      - "phonebot/ml/ollama.py"
      - "scripts/ollama_check.py"
      - ".github/workflows/ollama-check.yml"
  workflow_dispatch:
    inputs:
      myslenie:
        description: "Porównaj też tryb „myślenia” (na procesorze CI ok. 40 minut)"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx
      - name: Ollama + qwen3:8b
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done
          ollama pull qwen3:8b
      - run: python scripts/ollama_check.py
        env:
          PYTHONPATH: .
          PYTHONIOENCODING: utf-8
          OLLAMA_THINK: ${{ inputs.myslenie && '1' || '0' }}
