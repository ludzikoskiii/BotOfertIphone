name: probe-portals

# Rozpoznanie nowych źródeł (Lento, Allegro API, eBay API, NBP, Swappie, Back Market, Refurbed).
# Uruchamiane ręcznie lub po zmianie skryptu; wynik w logu i w Artifacts.
on:
  push:
    paths:
      - "scripts/probe_portals.py"
      - ".github/workflows/probe-portals.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx selectolax
      - run: python scripts/probe_portals.py probe_portals.txt
        env:
          PYTHONIOENCODING: utf-8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-portals
          path: probe_portals.txt
