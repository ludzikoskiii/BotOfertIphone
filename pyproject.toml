[project]
name = "phonebot"
version = "1.1.0"
description = "Wyszukiwarka i wycena opłacalnych ofert używanych iPhone'ów (OLX, Allegro Lokalnie, Vinted)"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "tenacity>=8.2",
    "selectolax>=0.3.21",
    "anthropic>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["phonebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: testy na żywo z prawdziwymi portalami (wymagają internetu)"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP017"]
